<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horiverse — Clash of Clans</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root{
      --gold:#d9b457; --gold-light:#e5c982;
      --dark:#1a1a2e; --dark2:#16213e; --dark3:#0f3460;
      --card:#1e1e3a; --card2:#252550;
      --text:#e0e0f0; --text-dim:#9090b0;
      --green:#2ecc71; --red:#e74c3c; --blue:#3498db;
      --border:rgba(217,180,87,0.15);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Poppins',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}
    a{color:var(--gold);}

    /* LOGIN */
    #login-overlay{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999;}
    .login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .login-logo{font-size:2rem;font-weight:700;color:var(--gold);margin-bottom:8px;}
    .login-logo span{color:var(--text-dim);font-weight:300;}
    .login-subtitle{color:var(--text-dim);font-size:.85rem;margin-bottom:32px;text-transform:uppercase;letter-spacing:1px;}
    .login-box input{width:100%;padding:12px 16px;background:var(--dark2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem;margin-bottom:12px;outline:none;transition:border-color .2s;}
    .login-box input:focus{border-color:var(--gold);}
    .login-btn{width:100%;padding:13px;background:var(--gold);color:#1a1a2e;border:none;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;margin-top:8px;}
    .login-btn:hover{background:var(--gold-light);transform:translateY(-1px);}
    #login-error{color:var(--red);font-size:.85rem;margin-top:12px;display:none;}

    /* LAYOUT */
    #app{display:none;}
    .topbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .topbar-logo{font-size:1.4rem;font-weight:700;color:var(--gold);}
    .topbar-logo span{color:var(--text-dim);font-weight:300;}
    .topbar-logo a{color:inherit;}
    .topbar-right{display:flex;align-items:center;gap:16px;}
    .topbar-tag{font-size:.75rem;color:var(--text-dim);background:var(--card);padding:4px 10px;border-radius:20px;}
    .logout-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .2s;font-family:inherit;}
    .logout-btn:hover{border-color:var(--red);color:var(--red);}
    .main-wrap{padding:24px;max-width:1300px;margin:0 auto;}

    /* TABS */
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;}
    .tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-dim);padding:12px 20px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:-1px;}
    .tab:hover{color:var(--text);}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
    .pane{display:none;}
    .pane.active{display:block;}

    /* BANNERS */
    .banner{border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:.85rem;display:flex;align-items:center;gap:10px;}
    .banner i{font-size:1rem;}
    .banner.sample{background:rgba(217,180,87,.10);border:1px solid var(--border);color:var(--gold-light);}
    .banner.error{background:rgba(231,76,60,.10);border:1px solid rgba(231,76,60,.35);color:#f0a9a2;}
    .banner.live{background:rgba(46,204,113,.10);border:1px solid rgba(46,204,113,.35);color:#8fe3b4;}

    /* PROFILE HEADER */
    .profile-head{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:20px;flex-wrap:wrap;}
    .th-badge{width:66px;height:66px;flex:0 0 auto;border-radius:14px;background:var(--dark3);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);}
    .th-badge b{font-size:1.5rem;color:var(--gold);line-height:1;}
    .th-badge span{font-size:.6rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
    .profile-name{font-size:1.5rem;font-weight:700;}
    .profile-tag{color:var(--text-dim);font-size:.85rem;margin-top:2px;}
    .profile-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    .chip{background:var(--dark2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.72rem;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;}
    .chip img{width:16px;height:16px;object-fit:contain;}
    .chip b{color:var(--text);font-weight:600;}

    /* PANELS */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
    .panel.wide{grid-column:1/-1;}
    .panel-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px;display:flex;align-items:center;gap:8px;}
    .panel-title i{color:var(--gold);}

    /* STAT TILES */
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
    .tile{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
    .tile b{display:block;font-size:1.35rem;color:var(--gold);font-weight:700;line-height:1.1;}
    .tile span{display:block;font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:6px;}

    /* KEY/VALUE TABLE */
    .kv{width:100%;border-collapse:collapse;font-size:.82rem;}
    .kv td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.04);}
    .kv td:first-child{color:var(--text-dim);}
    .kv td:last-child{font-weight:600;color:var(--text);text-align:right;word-break:break-word;}
    .kv tr:last-child td{border-bottom:none;}

    /* BARS */
    .bar-row{margin-bottom:11px;}
    .bar-row:last-child{margin-bottom:0;}
    .bar-label{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:5px;}
    .bar-label span:last-child{color:var(--text-dim);}
    .bar-track{height:7px;border-radius:6px;background:var(--dark2);overflow:hidden;}
    .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
    .bar-fill.max{background:linear-gradient(90deg,var(--green),#7ce8a6);}
    .scroll{max-height:320px;overflow-y:auto;padding-right:6px;}
    .scroll::-webkit-scrollbar{width:7px;}
    .scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

    /* RAW */
    details.raw{margin-top:8px;}
    details.raw summary{cursor:pointer;color:var(--text-dim);font-size:.8rem;padding:6px 0;}
    details.raw pre{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;font-size:.75rem;color:var(--text);max-height:360px;}

    @media(max-width:600px){ .main-wrap{padding:16px;} .profile-head{gap:14px;} }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">Hori<span>verse</span></div>
    <div class="login-subtitle">Clash of Clans</div>
    <input type="text" id="login-user" placeholder="Username" autocomplete="username">
    <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
    <div id="login-error">Invalid username or password.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><a href="/">Hori<span>verse</span></a></div>
    <div class="topbar-right">
      <span class="topbar-tag"><i class="fas fa-shield-halved"></i> Clash of Clans</span>
      <button class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="main-wrap">
    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>
  </div>
</div>

<script>
// ── AUTH ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-overlay').style.display !== 'none') doLogin();
});

function showLogin(){ document.getElementById('login-overlay').style.display='flex'; document.getElementById('app').style.display='none'; setTimeout(()=>document.getElementById('login-user').focus(),80); }
function showApp(){ document.getElementById('login-overlay').style.display='none'; document.getElementById('app').style.display='block'; }

async function doLogin(){
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.style.display='none';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    if(r.ok){ boot(); } else { err.style.display='block'; }
  }catch{ err.style.display='block'; }
}
async function doLogout(){ await fetch('/api/logout',{method:'POST'}); showLogin(); }

// ── LOAD ────────────────────────────────────────────────
async function boot(){
  let r;
  try{ r = await fetch('/api/coc'); }
  catch{ showApp(); renderError('Network error contacting /api/coc.'); return; }
  if(r.status === 401){ showLogin(); return; }
  showApp();
  const body = await r.json().catch(()=>({}));
  if(!r.ok){ renderError(body.error || ('API error '+r.status)); return; }
  render(body);
}

// ── HELPERS ─────────────────────────────────────────────
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (typeof n==='number' && isFinite(n)) ? n.toLocaleString('en-US') : esc(n);
const title = s => String(s||'').replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();
const isScalar = v => v==null || ['string','number','boolean'].includes(typeof v);
const iconUrl = o => o && (o.small || o.medium || o.tiny || o.large) || '';

function tile(label,value){ return `<div class="tile"><b>${value===undefined?'—':fmt(value)}</b><span>${esc(label)}</span></div>`; }
function bar(name,level,max){
  const pct = max ? Math.min(100,Math.round(level/max*100)) : 0;
  return `<div class="bar-row"><div class="bar-label"><span>${esc(name)}</span><span>${level}${max?' / '+max:''}</span></div>`+
         `<div class="bar-track"><div class="bar-fill ${level>=max?'max':''}" style="width:${pct}%"></div></div></div>`;
}
function panel(t,icon,inner,wide){ return `<div class="panel${wide?' wide':''}"><div class="panel-title"><i class="fas ${icon}"></i>${esc(t)}</div>${inner}</div>`; }

// ── RENDER ──────────────────────────────────────────────
let TABS=[];
function render(body){
  TABS = body.villages || [];
  const tabsEl = document.getElementById('tabs');
  const panesEl = document.getElementById('panes');
  tabsEl.innerHTML = TABS.map((v,i)=>`<button class="tab ${i===0?'active':''}" data-i="${i}" onclick="selectTab(${i})">${esc(v.name)}</button>`).join('');
  panesEl.innerHTML = TABS.map((v,i)=>`<div class="pane ${i===0?'active':''}" id="pane-${i}">${renderVillage(v)}</div>`).join('');
}
function selectTab(i){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.i===i));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+i));
}
function renderError(msg){
  document.getElementById('tabs').innerHTML='';
  document.getElementById('panes').innerHTML=`<div class="banner error"><i class="fas fa-triangle-exclamation"></i>${esc(msg)}</div>`;
}

function renderVillage(v){
  let html='';
  if(v.source==='sample') html+=`<div class="banner sample"><i class="fas fa-flask"></i>${esc(v.note||'Sample data.')}</div>`;
  else if(v.source==='error') html+=`<div class="banner error"><i class="fas fa-triangle-exclamation"></i>${esc(v.error||'Failed to load.')}</div>`;
  else if(v.source==='live') html+=`<div class="banner live"><i class="fas fa-circle-check"></i>Live data from the Clash of Clans API.</div>`;

  const d = v.data;
  if(!d){ return html || `<div class="banner error"><i class="fas fa-triangle-exclamation"></i>No data.</div>`; }

  // Profile header
  const league = d.leagueTier || d.league || d.builderBaseLeague;
  html += `<div class="profile-head">`;
  if(d.townHallLevel!==undefined) html+=`<div class="th-badge"><b>${d.townHallLevel}</b><span>Town Hall</span></div>`;
  else if(d.clanLevel!==undefined) html+=`<div class="th-badge"><b>${d.clanLevel}</b><span>Level</span></div>`;
  html += `<div><div class="profile-name">${esc(d.name||v.name)}</div>`;
  if(d.tag) html+=`<div class="profile-tag">${esc(d.tag)}</div>`;
  html += `<div class="profile-meta">`;
  if(d.expLevel!==undefined) html+=`<span class="chip"><i class="fas fa-star"></i>XP <b>${d.expLevel}</b></span>`;
  if(league) html+=`<span class="chip">${iconUrl(league.iconUrls)?`<img src="${esc(iconUrl(league.iconUrls))}" onerror="this.remove()">`:''}<b>${esc(league.name)}</b></span>`;
  if(d.role) html+=`<span class="chip"><i class="fas fa-user-shield"></i><b>${esc(title(d.role))}</b></span>`;
  if(d.warPreference) html+=`<span class="chip"><i class="fas fa-khanda"></i>War <b>${esc(d.warPreference)}</b></span>`;
  (d.labels||[]).forEach(l=>{ html+=`<span class="chip">${iconUrl(l.iconUrls)?`<img src="${esc(iconUrl(l.iconUrls))}" onerror="this.remove()">`:'<i class="fas fa-tag"></i>'}${esc(l.name)}</span>`; });
  html += `</div></div></div>`;

  const panels=[];

  // Key stat tiles
  const statDefs=[['Trophies','trophies'],['Best Trophies','bestTrophies'],['War Stars','warStars'],
    ['Attack Wins','attackWins'],['Defense Wins','defenseWins'],['Donations','donations'],
    ['Received','donationsReceived'],['Capital Contrib.','clanCapitalContributions']];
  const tiles=statDefs.filter(([,k])=>d[k]!==undefined).map(([l,k])=>tile(l,d[k])).join('');
  if(tiles) panels.push(panel('Key Stats','fa-trophy',`<div class="tiles">${tiles}</div>`,true));

  // Builder base
  const bDefs=[['BH Level','builderHallLevel'],['Builder Trophies','builderBaseTrophies'],['Best','bestBuilderBaseTrophies']];
  const bTiles=bDefs.filter(([,k])=>d[k]!==undefined).map(([l,k])=>tile(l,d[k])).join('');
  if(bTiles) panels.push(panel('Builder Base','fa-hammer',`<div class="tiles">${bTiles}</div>`));

  // Clan
  if(d.clan){
    const c=d.clan;
    panels.push(panel('Clan','fa-users',`<table class="kv">
      <tr><td>Name</td><td>${esc(c.name||'—')}</td></tr>
      <tr><td>Tag</td><td>${esc(c.tag||'—')}</td></tr>
      <tr><td>Level</td><td>${c.clanLevel!=null?c.clanLevel:'—'}</td></tr>
    </table>`));
  }

  // Heroes / equipment / spells / troops (level bars, home village only)
  const groups=[['Heroes','fa-crown','heroes'],['Hero Equipment','fa-shield-halved','heroEquipment'],
    ['Spells','fa-wand-sparkles','spells'],['Troops','fa-dragon','troops']];
  groups.forEach(([label,icon,key])=>{
    const arr=(d[key]||[]).filter(x=>x && (x.village===undefined||x.village==='home'));
    if(!arr.length) return;
    const bars=arr.map(x=>bar(x.name,x.level,x.maxLevel)).join('');
    const inner=arr.length>8 ? `<div class="scroll">${bars}</div>` : bars;
    panels.push(panel(`${label} (${arr.length})`,icon,inner));
  });

  // Achievements
  if(Array.isArray(d.achievements)&&d.achievements.length){
    const rows=d.achievements.map(a=>`<tr><td><span style="color:var(--gold)">${'★'.repeat(a.stars||0)}</span><span style="color:var(--text-dim)">${'☆'.repeat(3-(a.stars||0))}</span> ${esc(a.name)}</td><td>${fmt(a.value)}${a.target?' / '+fmt(a.target):''}</td></tr>`).join('');
    panels.push(panel(`Achievements (${d.achievements.length})`,'fa-medal',`<div class="scroll"><table class="kv">${rows}</table></div>`,true));
  }

  // Generic: all remaining top-level scalar fields not already shown above
  const skip=new Set(['name','tag','_sample','townHallLevel','clanLevel','expLevel','role','warPreference',
    'league','leagueTier','builderBaseLeague','labels','clan','achievements','heroes','spells','troops',
    'heroEquipment','playerHouse','legendStatistics',
    'trophies','bestTrophies','warStars','attackWins','defenseWins',
    'donations','donationsReceived','clanCapitalContributions',
    'builderHallLevel','builderBaseTrophies','bestBuilderBaseTrophies']);
  const rows=Object.entries(d).filter(([k,val])=>!skip.has(k)&&isScalar(val)&&d[k]!==undefined)
    .map(([k,val])=>`<tr><td>${esc(title(k))}</td><td>${fmt(val)}</td></tr>`).join('');
  if(rows) panels.push(panel('All Fields','fa-list',`<table class="kv">${rows}</table>`,true));

  html += `<div class="grid">${panels.join('')}</div>`;
  html += `<details class="raw"><summary><i class="fas fa-code"></i> Raw JSON</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details>`;
  return html;
}

// ── INIT ────────────────────────────────────────────────
boot();
</script>
</body>
</html>
