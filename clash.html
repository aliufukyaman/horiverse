<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horiverse — Clash of Clans</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root{
      --gold:#d9b457; --gold-light:#e5c982;
      --dark:#1a1a2e; --dark2:#16213e; --dark3:#0f3460;
      --card:#1e1e3a; --card2:#252550;
      --text:#e0e0f0; --text-dim:#9090b0; --faded:#5f6088;
      --green:#2ecc71; --red:#e74c3c; --blue:#3498db;
      --border:rgba(217,180,87,0.15);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Poppins',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}
    a{color:var(--gold);}

    /* LOGIN */
    #login-overlay{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999;}
    .login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .login-logo{font-size:2rem;font-weight:700;color:var(--gold);margin-bottom:8px;}
    .login-logo span{color:var(--text-dim);font-weight:300;}
    .login-subtitle{color:var(--text-dim);font-size:.85rem;margin-bottom:32px;text-transform:uppercase;letter-spacing:1px;}
    .login-box input{width:100%;padding:12px 16px;background:var(--dark2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem;margin-bottom:12px;outline:none;transition:border-color .2s;}
    .login-box input:focus{border-color:var(--gold);}
    .login-btn{width:100%;padding:13px;background:var(--gold);color:#1a1a2e;border:none;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;margin-top:8px;}
    .login-btn:hover{background:var(--gold-light);transform:translateY(-1px);}
    #login-error{color:var(--red);font-size:.85rem;margin-top:12px;display:none;}

    /* LAYOUT */
    #app{display:none;}
    .topbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .topbar-logo{font-size:1.4rem;font-weight:700;color:var(--gold);}
    .topbar-logo span{color:var(--text-dim);font-weight:300;}
    .topbar-logo a{color:inherit;}
    .topbar-right{display:flex;align-items:center;gap:16px;}
    .topbar-tag{font-size:.75rem;color:var(--text-dim);background:var(--card);padding:4px 10px;border-radius:20px;}
    .logout-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .2s;font-family:inherit;}
    .logout-btn:hover{border-color:var(--red);color:var(--red);}
    .main-wrap{padding:22px;max-width:1180px;margin:0 auto;}

    /* TABS */
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
    .tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-dim);padding:11px 18px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:-1px;}
    .tab:hover{color:var(--text);}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
    .pane{display:none;}
    .pane.active{display:block;}

    .banner{border-radius:10px;padding:11px 15px;margin-bottom:16px;font-size:.83rem;display:flex;align-items:center;gap:9px;}
    .banner.sample{background:rgba(217,180,87,.10);border:1px solid var(--border);color:var(--gold-light);}
    .banner.error{background:rgba(231,76,60,.10);border:1px solid rgba(231,76,60,.35);color:#f0a9a2;}

    /* COMPACT VILLAGE HEADER (profile + key stats merged, small) */
    .vhead{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px;flex-wrap:wrap;}
    .th-badge{width:54px;height:54px;flex:0 0 auto;border-radius:12px;background:var(--dark3);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);}
    .th-badge b{font-size:1.15rem;color:var(--gold);line-height:1;}
    .th-badge span{font-size:.55rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
    .vhead-main{flex:1 1 200px;min-width:180px;}
    .vhead-name{font-size:1.15rem;font-weight:700;}
    .vhead-name .tag{color:var(--text-dim);font-size:.8rem;font-weight:400;margin-left:6px;}
    .vhead-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;}
    .chip{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:3px 10px;font-size:.7rem;color:var(--text-dim);display:inline-flex;align-items:center;gap:5px;}
    .chip img{width:14px;height:14px;object-fit:contain;}
    .chip b{color:var(--text);font-weight:600;}

    /* SUMMARY — time to max, per category */
    .summary{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:22px;}
    .sum-title{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);margin-bottom:13px;}
    .sum-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:11px;}
    .sum-tile{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;text-align:center;}
    .sum-tile span{display:block;font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
    .sum-tile b{display:block;font-size:1.2rem;color:var(--gold);font-weight:700;margin:5px 0 3px;}
    .sum-tile small{display:block;font-size:.66rem;color:var(--faded);}
    .sum-tile.total{background:linear-gradient(135deg,rgba(217,180,87,.16),rgba(217,180,87,.05));border-color:rgba(217,180,87,.4);}
    .sum-tile.total b{color:var(--gold-light);}
    .sum-tile.done b{color:var(--green);}

    /* CATEGORY SECTIONS (full width, stacked) */
    .cat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
    .cat-head{display:flex;align-items:center;gap:9px;font-size:.95rem;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
    .cat-head i{color:var(--gold);}
    .cat-head .cat-meta{margin-left:auto;font-size:.72rem;color:var(--text-dim);font-weight:400;}
    .cat-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px 22px;}

    /* UPGRADE BAR */
    .ub-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
    .ub-name{font-size:.83rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ub-nums{font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;}
    .ub-nums b{color:var(--text);font-weight:700;}
    .ub-thmax{color:var(--gold);}
    .ub-absmax{color:var(--faded);}       /* absolute max across all THs — faded/passive */
    .ub-track{position:relative;height:13px;border-radius:5px;background:rgba(255,255,255,.13);overflow:hidden;}
    .ub-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
    .ub-fill.done{background:linear-gradient(90deg,var(--green),#7ce8a6);}
    .ub-fill.ref{background:rgba(217,180,87,.30);}   /* buildings: reference level count, not tracked progress */
    /* per-level notches (one segment per level) so remaining levels are countable */
    .ub-seg{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--n) - 2px),var(--card) calc(100%/var(--n) - 2px) calc(100%/var(--n)));}
    .ub.future{opacity:.4;}
    .ub.ref .ub-nums,.ub.future .ub-nums{color:var(--gold);}
    .ub-sub{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-dim);margin-top:4px;}
    .ub-sub .done{color:var(--green);}


    .note{font-size:.72rem;color:var(--faded);line-height:1.6;margin-top:6px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
    .note b{color:var(--text-dim);}
    @media(max-width:600px){ .main-wrap{padding:14px;} .cat-bars{grid-template-columns:1fr;} }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">Hori<span>verse</span></div>
    <div class="login-subtitle">Clash of Clans</div>
    <input type="text" id="login-user" placeholder="Username" autocomplete="username">
    <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
    <div id="login-error">Invalid username or password.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><a href="/">Hori<span>verse</span></a></div>
    <div class="topbar-right">
      <span class="topbar-tag"><i class="fas fa-shield-halved"></i> Clash of Clans</span>
      <button class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>
  <div class="main-wrap">
    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>
  </div>
</div>

<script>
// ── AUTH ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-overlay').style.display !== 'none') doLogin();
});
function showLogin(){ document.getElementById('login-overlay').style.display='flex'; document.getElementById('app').style.display='none'; setTimeout(()=>document.getElementById('login-user').focus(),80); }
function showApp(){ document.getElementById('login-overlay').style.display='none'; document.getElementById('app').style.display='block'; }
async function doLogin(){
  const username=document.getElementById('login-user').value.trim();
  const password=document.getElementById('login-pass').value;
  const err=document.getElementById('login-error'); err.style.display='none';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    if(r.ok){ boot(); } else { err.style.display='block'; }
  }catch{ err.style.display='block'; }
}
async function doLogout(){ await fetch('/api/logout',{method:'POST'}); showLogin(); }

async function boot(){
  let r;
  try{ r=await fetch('/api/coc'); }catch{ showApp(); renderError('Network error contacting /api/coc.'); return; }
  if(r.status===401){ showLogin(); return; }
  showApp();
  const body=await r.json().catch(()=>({}));
  if(!r.ok){ renderError(body.error||('API error '+r.status)); return; }
  render(body);
}

// ── HELPERS ─────────────────────────────────────────────
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtInt=n=>(typeof n==='number'&&isFinite(n))?n.toLocaleString('en-US'):esc(n);

// ── RENDER ──────────────────────────────────────────────
let TABS=[];
function render(body){
  TABS=body.villages||[];
  document.getElementById('tabs').innerHTML=TABS.map((v,i)=>`<button class="tab ${i===0?'active':''}" data-i="${i}" onclick="selectTab(${i})">${esc(v.name)}</button>`).join('');
  document.getElementById('panes').innerHTML=TABS.map((v,i)=>`<div class="pane ${i===0?'active':''}" id="pane-${i}">${renderVillage(v)}</div>`).join('');
}
function selectTab(i){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.i===i));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+i));
}
function renderError(msg){
  document.getElementById('tabs').innerHTML='';
  document.getElementById('panes').innerHTML=`<div class="banner error"><i class="fas fa-triangle-exclamation"></i>${esc(msg)}</div>`;
}

// per-level notch overlay (one segment per level); skipped when too many to count
const seg = n => (n && n<=30) ? `<div class="ub-seg" style="--n:${n}"></div>` : '';

// Renders one unit row. Three kinds:
//   future    → not unlocked at this TH yet (passive/greyed, shows unlock TH)
//   target    → available but no current level known (buildings without a set
//               level): empty bar + max target, clearly NOT maxed
//   tracked   → current/(thMax–absMax) with a notched, TH-based fill
function renderItem(it){
  if(it.future){
    return `<div class="ub future">
      <div class="ub-top"><span class="ub-name">${esc(it.name)}</span><span class="ub-nums">max ${it.absMax}</span></div>
      <div class="ub-track">${seg(it.absMax)}</div>
      <div class="ub-sub"><span></span><span><i class="fas fa-lock"></i> unlocks at TH${it.unlockTH}</span></div>
    </div>`;
  }
  if(!it.tracked){ // available target, current level not known (set it in coc-village-levels.json)
    const nums = it.absMax>it.thMax
      ? `<span class="ub-thmax">${it.thMax}</span><span class="ub-absmax"> (${it.absMax})</span>`
      : `<span class="ub-thmax">${it.thMax}</span>`;
    return `<div class="ub ref">
      <div class="ub-top"><span class="ub-name">${esc(it.name)}</span><span class="ub-nums">max ${nums}</span></div>
      <div class="ub-track">${seg(it.thMax)}</div>
      <div class="ub-sub"><span></span><span>target · set your level</span></div>
    </div>`;
  }
  // tracked unit — current/(thMax–absMax), notched TH-based fill
  const cur=it.current, thMax=it.thMax, absMax=it.absMax;
  const fillPct=thMax>0?Math.min(100,Math.round(cur/thMax*100)):0;
  const nums = absMax>thMax
    ? `<b>${cur}</b>/(<span class="ub-thmax">${thMax}</span><span class="ub-absmax">–${absMax}</span>)`
    : `<b>${cur}</b>/(<span class="ub-thmax">${thMax}</span>)`;
  const rem=Math.max(0,thMax-cur);
  const right = it.maxed ? `<span class="done">✓ maxed for TH</span>` : `<span>${rem} lvl${rem===1?'':'s'} left</span>`;
  return `<div class="ub">
    <div class="ub-top"><span class="ub-name">${esc(it.name)}</span><span class="ub-nums">${nums}</span></div>
    <div class="ub-track"><div class="ub-fill ${it.maxed?'done':''}" style="width:${fillPct}%"></div>${seg(thMax)}</div>
    <div class="ub-sub"><span></span>${right}</div>
  </div>`;
}

function renderVillage(v){
  let html='';
  if(v.source==='error') return `<div class="banner error"><i class="fas fa-triangle-exclamation"></i>${esc(v.error||'Failed to load.')}</div>`;
  if(v.source==='sample') html+=`<div class="banner sample"><i class="fas fa-flask"></i>${esc(v.note||'Sample data.')}</div>`;

  const h=v.header||{}; const st=h.stats||{};
  // Compact merged header (profile + key stats)
  const chips=[];
  if(h.league&&h.league.name) chips.push(`<span class="chip">${h.league.icon?`<img src="${esc(h.league.icon)}" onerror="this.remove()">`:'<i class="fas fa-medal"></i>'}<b>${esc(h.league.name)}</b></span>`);
  if(h.expLevel!=null) chips.push(`<span class="chip"><i class="fas fa-star"></i>XP <b>${h.expLevel}</b></span>`);
  if(st.bestTrophies!=null) chips.push(`<span class="chip"><i class="fas fa-trophy"></i>Best <b>${fmtInt(st.bestTrophies)}</b></span>`);
  if(st.warStars!=null) chips.push(`<span class="chip"><i class="fas fa-khanda"></i>War <b>${fmtInt(st.warStars)}</b>★</span>`);
  if(st.attackWins!=null) chips.push(`<span class="chip"><i class="fas fa-hand-fist"></i>Atk <b>${fmtInt(st.attackWins)}</b></span>`);
  if(st.donations!=null) chips.push(`<span class="chip"><i class="fas fa-gift"></i>Don <b>${fmtInt(st.donations)}</b></span>`);
  html+=`<div class="vhead">
    <div class="th-badge"><b>${h.townHallLevel!=null?('TH'+h.townHallLevel):'—'}</b><span>Town Hall</span></div>
    <div class="vhead-main">
      <div class="vhead-name">${esc(v.playerName||v.name)}<span class="tag">${esc(h.tag||v.tag||'')}</span></div>
      <div class="vhead-chips">${chips.join('')}</div>
    </div>
  </div>`;

  // Summary — maxed progress for every category that has tracked units
  const cats=v.categories||[];
  const summ=cats.filter(c=>c.count>0);
  const tiles=summ.map(c=>{
    const all=c.maxedCount===c.count;
    return `<div class="sum-tile ${all?'done':''}"><span>${esc(c.label)}</span><b>${c.maxedCount}/${c.count}</b><small>maxed for TH</small></div>`;
  }).join('');
  const totMax=summ.reduce((s,c)=>s+c.maxedCount,0), totN=summ.reduce((s,c)=>s+c.count,0);
  html+=`<div class="summary">
    <div class="sum-title"><i class="fas fa-gauge-high"></i> TH${h.townHallLevel} progress — maxed per category</div>
    <div class="sum-tiles">${tiles}
      <div class="sum-tile total ${totN>0&&totMax===totN?'done':''}"><span>Total</span><b>${totMax}/${totN}</b><small>units maxed</small></div>
    </div>
  </div>`;

  // Category sections (stacked, full width) — every group renders bars, in file (game) order
  html+=cats.map(c=>{
    const avail=c.items.filter(i=>!i.future);
    const targets=avail.filter(i=>!i.tracked).length;
    let meta;
    if(c.count>0 && targets) meta=`${c.maxedCount}/${c.count} maxed · ${targets} not set`;
    else if(c.count>0) meta=`${c.maxedCount}/${c.count} maxed for TH`;
    else if(targets) meta=`${targets} targets · set your levels`;
    else meta=`unlocks at a higher TH`;
    return `<div class="cat">
      <div class="cat-head"><i class="fas ${esc(c.icon)}"></i> ${esc(c.label)} <span class="cat-meta">${meta}</span></div>
      <div class="cat-bars">${c.items.map(renderItem).join('')}</div>
    </div>`;
  }).join('');

  html+=`<div class="note">
    <b>How to read:</b> <b style="color:var(--gold)">current</b>/(<b style="color:var(--gold)">this-TH max</b><span class="ub-absmax">–max across all THs</span>). Bars are <b>TH-based</b> and <b>notched per level</b> — count the empty notches to see how many upgrades remain. Faded rows <b>unlock at a higher TH</b>.
    <b>Defenses / Traps / Walls / Resources / Army buildings</b> aren't in Supercell's API, so they start as <b>targets</b> (max level at your TH, not filled). To track them, put your current levels in <b>api/coc-village-levels.json</b> and they'll get real progress bars. Max levels come from clash.ninja (<b>api/coc-game-data.json</b>).
  </div>`;
  return html;
}

boot();
</script>
</body>
</html>
